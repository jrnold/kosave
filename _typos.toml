# Lint baseline: typos. Add project words under [default.extend-words] with a comment.
[files]
extend-exclude = [
  "*.bib",
  "*.html",
  "*.lock",
  "_freeze/",
  "_site/",
  "data/",
  "data-raw/",
  "docs/DTIC_ADA360311.txt",  # OCR text extracted from a scan: full of recognition errors
]

[default]
extend-ignore-re = [
  # Hex strings and hashes
  "\\b[0-9a-f]{7,40}\\b",
  # A line ending in a `spellchecker:disable-line` comment
  "(?Rm)^.*(#|//|--)\\s*spellchecker:disable-line$",
]

[default.extend-words]
# REFERENC is the dBASE table name (REFERENC.DBF), limited to eight characters
referenc = "referenc"
# Misspellings kept verbatim from the Word source of docs/GUIDE.md
accidently = "accidently"
curser = "curser"
